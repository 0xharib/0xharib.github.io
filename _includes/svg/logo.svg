<svg id="svg-logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="none" aria-label="Hari Balaji — Truchet tile mark">
  <!-- 2×2 Truchet smith tiles: corner arcs in ink, the four center arcs form a circle in amber -->
  <g stroke="#231c11" stroke-width="6.5" stroke-linecap="butt">
    <path d="M16 0 A16 16 0 0 1 0 16"/>
    <path d="M48 0 A16 16 0 0 0 64 16"/>
    <path d="M0 48 A16 16 0 0 1 16 64"/>
    <path d="M64 48 A16 16 0 0 0 48 64"/>
  </g>
  <g stroke="#b4530a" stroke-width="6.5" stroke-linecap="butt">
    <path d="M32 16 A16 16 0 0 1 48 32"/>
    <path d="M48 32 A16 16 0 0 1 32 48"/>
    <path d="M32 48 A16 16 0 0 1 16 32"/>
    <path d="M16 32 A16 16 0 0 1 32 16"/>
  </g>
</svg>
